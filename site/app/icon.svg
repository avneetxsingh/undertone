<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A waveform: the undertone under the conversation. Hard-codes the
       palette's accent rather than using a token, because a favicon renders
       in browser chrome where the page's CSS variables do not resolve. -->
  <rect width="32" height="32" rx="7" fill="#7c3aed" />
  <g fill="#ffffff">
    <rect x="7" y="14" width="2.5" height="4" rx="1.25" />
    <rect x="12" y="10" width="2.5" height="12" rx="1.25" />
    <rect x="17" y="7" width="2.5" height="18" rx="1.25" />
    <rect x="22" y="12" width="2.5" height="8" rx="1.25" />
  </g>
</svg>
